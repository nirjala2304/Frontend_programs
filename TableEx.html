<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Items and Prices</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 40px;
    }
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 0 auto;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      text-align: left;
      padding: 12px 20px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: blue;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    
  </style>
</head>
<body>

  <table>
    <center><h1>Sample Online Items and Prices</h1></center>
    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Laptop</td>
        <td>$800</td>
      </tr>
      <tr>
        <td>Smartphone</td>
        <td>$400</td>
      </tr>
      <tr>
        <td>Headphones</td>
        <td>$50</td>
      </tr>
      <tr>
        <td>Tablet</td>
        <td>$300</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
